name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  testes:
    name: Testes e build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

  deploy:
    name: Deploy (producao)
    needs: [testes]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    concurrency:
      group: deploy-producao
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Entrar na rede privada
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:deploy-ci
          version: latest

      # O runner so enxerga o servidor por dentro da rede privada, e a sessao e
      # autorizada pela identidade dele ali — nao ha chave de SSH guardada aqui.
      #
      # O roteiro viaja com o deploy, em vez de ser executado do disco do
      # servidor: assim o que roda e sempre a versao que esta subindo, e um
      # servidor que nunca recebeu deploy nao precisa que alguem ponha o arquivo
      # nele antes. Ele e gravado la e so entao executado — alimentar o bash
      # pela entrada padrao nao funciona aqui, porque o primeiro `docker compose
      # exec` de dentro dele consome essa mesma entrada e engole o resto do
      # proprio roteiro, que entao termina no meio anunciando sucesso.
      - name: Enviar o roteiro ao servidor
        env:
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cat > ~/deploy-ci.sh" < scripts/deploy-ci.sh

      - name: Atualizar o servidor
        env:
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          ssh -n -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cd '${DEPLOY_PATH}' && bash ~/deploy-ci.sh"

      # O codigo de saida do roteiro nao basta como prova: um roteiro
      # interrompido no meio tambem sai com zero. Quem decide se o deploy
      # aconteceu e o servidor, dizendo em que versao ele ficou.
      - name: Conferir a versao que ficou no servidor
        env:
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          no_servidor="$(ssh -n -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cat '${DEPLOY_PATH}/.deployed-commit' 2>/dev/null || echo nenhuma")"
          echo "servidor: ${no_servidor}"
          echo "esperado: ${GITHUB_SHA}"
          if [ "${no_servidor}" != "${GITHUB_SHA}" ]; then
            echo "::error::o deploy nao chegou ao fim — o servidor nao esta na versao deste commit"
            exit 1
          fi
