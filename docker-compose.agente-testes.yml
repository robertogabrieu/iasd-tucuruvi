# Camada de TESTES da stack local por agente (scripts/agente-stack.sh testar), sobreposta a
# docker-compose.agente.yml. Os testes deste projeto não usam banco: só o container de testes sobe,
# com teto de memória, e cai quando a rodada termina.
#
# TZ de São Paulo porque o container roda em UTC por padrão, como a máquina do desenvolvedor não.

services:
  testes:
    image: iasd-tucuruvi/agente:dev
    profiles: ["testes"]
    user: "${AGENTE_UID:-1000}:${AGENTE_GID:-1000}"
    working_dir: /app
    environment:
      HOME: /tmp
      TZ: America/Sao_Paulo
      NODE_OPTIONS: "--max-old-space-size=1536"
    volumes:
      - .:/app:cached
      - node_modules:/app/node_modules
    tmpfs:
      - /tmp
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2.0
    labels:
      - "agente.tipo=efemero"
